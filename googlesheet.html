<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trip Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f2f2f2;padding:5px}
.sheet{max-width:900px;margin:auto;background:#fff;border:2px solid #000;padding:6px}
h2{text-align:center;font-size:16px;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
td{border:1px solid #000;padding:3px}
label{font-weight:bold;font-size:11px}
input,textarea{width:100%;border:none;outline:none;font-size:12px}
textarea{resize:none}
canvas{border:1px solid #000;height:55px;width:100%}
.clear{font-size:11px;color:blue;cursor:pointer}
button{width:100%;padding:6px;margin-top:6px}
@media print{button{display:none}}
</style>
</head>

<body>
<div class="sheet">
<h2>TRIP SHEET</h2>

<table>
<tr>
<td><label>Service City</label><input id="serviceCity"></td>
<td><label>Organisation</label><input id="organisation"></td>
<td><label>Guest Name</label><input id="guestName"></td>
</tr>
<tr>
<td><label>DS No</label><input id="dsNo"></td>
<td><label>Booking ID</label><input id="bookingId"></td>
<td><label>Reporting Address</label><input id="reportingAddress"></td>
</tr>
</table>

<table>
<tr>
<td><label>Starting Date</label><input type="date" id="startDate"></td>
<td><label>Starting Time</label><input type="time" id="startTime" oninput="calcHrs()"></td>
<td><label>Starting KM</label><input type="number" id="startKm" oninput="calcKm()"></td>
</tr>
<tr>
<td><label>Closing Date</label><input type="date" id="closeDate"></td>
<td><label>Closing Time</label><input type="time" id="closeTime" oninput="calcHrs()"></td>
<td><label>Closing KM</label><input type="number" id="closeKm" oninput="calcKm()"></td>
</tr>
</table>

<table>
<tr>
<td><label>Reporting Time</label><input type="time" id="reportingTime"></td>
<td><label>Car Booked</label><input id="carBooked"></td>
<td><label>Car Allotted</label><input id="carAllotted"></td>
</tr>
<tr>
<td><label>Chauffeur Name</label><input id="chauffeurName"></td>
<td><label>Mobile No</label><input id="mobileNo"></td>
<td><label>Car No</label><input id="carNo"></td>
</tr>
</table>

<table>
<tr>
<td><label>Total Days</label><input id="totalDays"></td>
<td><label>Total Hrs</label><input id="totalHrs" readonly></td>
<td><label>Total KM</label><input id="totalKm" readonly></td>
</tr>
</table>

<table>
<tr>
<td><label>Routing Details</label><textarea id="routingDetails" rows="3"></textarea></td>
<td><label>Parking & Toll</label><textarea id="parkingToll" rows="3"></textarea></td>
</tr>
</table>

<table>
<tr>
<td>
<label>Guest Signature</label>
<canvas id="guestSign"></canvas>
<div class="clear" onclick="clearCanvas('guestSign')">Clear</div>
</td>
<td>
<label>Chauffeur Signature</label>
<canvas id="driverSign"></canvas>
<div class="clear" onclick="clearCanvas('driverSign')">Clear</div>
</td>
</tr>
</table>

<button onclick="window.print()">Print Trip Sheet</button>
</div>

<script>
function getParam(n){return new URLSearchParams(location.search).get(n)||"";}

window.onload=()=>{
[
"serviceCity","organisation","guestName","dsNo","bookingId","reportingAddress",
"startDate","startTime","startKm","closeDate","closeTime","closeKm",
"reportingTime","carBooked","carAllotted","chauffeurName",
"mobileNo","carNo","totalDays","routingDetails","parkingToll"
].forEach(id=>{
document.getElementById(id).value=getParam(id);
});
calcKm();calcHrs();
};

function calcKm(){
let s=+startKm.value||0,e=+closeKm.value||0;
totalKm.value=e>=s?e-s:0;
}
function calcHrs(){
if(!startTime.value||!closeTime.value)return;
let [sh,sm]=startTime.value.split(":").map(Number);
let [eh,em]=closeTime.value.split(":").map(Number);
let d=(eh*60+em)-(sh*60+sm);if(d<0)d+=1440;
totalHrs.value=Math.floor(d/60)+"h "+(d%60)+"m";
}

function initSign(id){
const c=document.getElementById(id),x=c.getContext("2d");
c.width=c.offsetWidth;c.height=c.offsetHeight;
let d=false;
const p=e=>{let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};
c.onmousedown=e=>{d=true;let o=p(e);x.beginPath();x.moveTo(o.x,o.y)};
c.onmousemove=e=>{if(!d)return;let o=p(e);x.lineTo(o.x,o.y);x.stroke()};
c.onmouseup=()=>d=false;
c.ontouchstart=e=>{d=true;let o=p(e);x.beginPath();x.moveTo(o.x,o.y)};
c.ontouchmove=e=>{e.preventDefault();if(!d)return;let o=p(e);x.lineTo(o.x,o.y);x.stroke()};
c.ontouchend=()=>d=false;
}
initSign("guestSign");initSign("driverSign");
function clearCanvas(id){let c=document.getElementById(id);c.getContext("2d").clearRect(0,0,c.width,c.height);}
</script>
</body>
</html>
