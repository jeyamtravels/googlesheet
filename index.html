<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Trip Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f2f2f2;padding:5px}
.sheet{max-width:900px;margin:auto;background:#fff;border:2px solid #000;padding:6px}
h2{text-align:center;font-size:16px;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
td{border:1px solid #000;padding:4px}
label{font-weight:bold;font-size:11px}
input,textarea{width:100%;border:none;font-size:12px}
textarea{resize:none}
</style>
</head>

<body>
<div class="sheet">
<h2>TRIP SHEET</h2>

<table>
<tr>
<td><label>Service City</label><input id="service_city"></td>
<td><label>Organisation</label><input id="organisation"></td>
<td><label>Guest Name</label><input id="guest_name"></td>
</tr>
<tr>
<td><label>DS No</label><input id="ds_no"></td>
<td><label>Booking ID</label><input id="booking_id"></td>
<td><label>Reporting Address</label><input id="reporting_address"></td>
</tr>
</table>

<table>
<tr>
<td><label>Starting Date</label><input id="starting_date" type="date"></td>
<td><label>Starting Time</label><input id="starting_time" type="time"></td>
<td><label>Starting KM</label><input id="starting_km" type="number"></td>
</tr>
<tr>
<td><label>Closing Date</label><input id="closing_date" type="date"></td>
<td><label>Closing Time</label><input id="closing_time" type="time"></td>
<td><label>Closing KM</label><input id="closing_km" type="number"></td>
</tr>
</table>

<table>
<tr>
<td><label>Total Days</label><input id="total_days" readonly></td>
<td><label>Total Hrs</label><input id="total_hrs" readonly></td>
<td><label>Total KM</label><input id="total_km" readonly></td>
</tr>
</table>

<table>
<tr>
<td><label>Parking</label><input id="parking" type="number"></td>
</tr>
</table>

<button onclick="window.print()">Print Trip Sheet</button>
</div>

<script>
const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

// Load data
window.onload = () => {
  const dsNo = new URLSearchParams(location.search).get("ds_no");
  if (!dsNo) return;

  fetch(`${SCRIPT_URL}?ds_no=${dsNo}`)
    .then(r => r.json())
    .then(data => {
      Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = data[id];
      });
      calculateAll();
    });
};

// CALCULATIONS
["starting_date","starting_time","closing_date","closing_time","starting_km","closing_km"]
.forEach(id => document.getElementById(id).addEventListener("input", calculateAll));

function calculateAll(){
  calcKM();
  calcHrsDays();
}

function calcKM(){
  const s = Number(starting_km.value);
  const c = Number(closing_km.value);
  if(!isNaN(s) && !isNaN(c)) total_km.value = c - s;
}

function calcHrsDays(){
  if(!starting_date.value || !starting_time.value || !closing_date.value || !closing_time.value) return;

  const start = new Date(`${starting_date.value}T${starting_time.value}`);
  const end   = new Date(`${closing_date.value}T${closing_time.value}`);
  const diff  = end - start;
  if(diff <= 0) return;

  const hrs = diff / 3600000;
  total_hrs.value = hrs.toFixed(2);
  total_days.value = Math.ceil(hrs / 24);
}
</script>
</body>
</html>
