<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trip Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  padding:5px;
}

.sheet{
  max-width:900px;
  margin:auto;
  background:#fff;
  border:2px solid #000;
  padding:6px;
}

h2{
  text-align:center;
  letter-spacing:1px;
  margin:2px 0 6px;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

td{
  border:1px solid #000;
  padding:3px;
  vertical-align:top;
}

label{
  font-weight:bold;
  font-size:11px;
  display:block;
  margin-bottom:1px;
}

input, textarea{
  width:100%;
  border:none;
  outline:none;
  font-size:12px;
  padding:1px 0;
}

textarea{
  resize:none;
  line-height:1.2;
}


/* fixed widths */
.w-small{width:110px;}
.w-medium{width:110px;}
.w-large{width:270px;}

/* signature */
canvas{
  border:1px solid #000;
  width:100%;
  height:55px;   /* was 80px */
  touch-action:none;
}


.clear{
  font-size:11px;
  color:blue;
  cursor:pointer;
  margin-top:3px;
}

/* print */
@media print{
    @page{
        margin:6mm;
    }
    body{margin:0};
  body{background:#fff;}
  button{display:none;}
  h2{font-size:14px;margin:2px 0;}
  td{padding:2px;}
  canvas{height:45px;}
}
</style>
</head>

<body>
<div class="sheet">
<h2>TRIP SHEET</h2>

<table>
<tr>
<td class="w-medium"><label>Service City</label><input id="service_city"></td>
<td class="w-medium"><label>Organisation</label><input id="organisation"></td>
<td class="w-large"><label>Guest Name</label><input id="guest_name"></td>
</tr>
<tr>
<td><label>DS No</label><input id="ds_no"></td>
<td><label>Booking ID</label><input id="booking_id"></td>
<td><label>Reporting Address</label><input id="reporting_address"></td>
</tr>
</table>

<table>
<tr>
<td class="w-small"><label>Starting Date</label><input id="starting_date" type="date"></td>
<td class="w-small"><label>Starting Time</label><input id="starting_time" type="time" oninput="calcHrs()"></td>
<td class="w-small"><label>Starting KM</label><input id="starting_km" type="number"  oninput="calcKm()"></td>
</tr>
<tr>
<td class="w-small"><label>Closing Date</label><input id="closing_date" type="date"></td>
<td class="w-small"><label>Closing Time</label><input id="closing_time" type="time"></td>
<td class="w-small"><label>Closing KM</label><input id="closing_km" type="number"></td>
</tr>
</table>

<table>
<tr>
<td><label>Total Days</label><input id="total_days" readonly></td>
<td><label>Total Hrs</label><input id="total_hrs" readonly></td>
<td><label>Total KM</label><input id="total_km" readonly></td>
</tr>
</table>
<!-- VEHICLE -->
<table>
<tr>
  <td><label>Reporting Time</label><input id="reporting_time" type="time"></td>
  <td><label>Car Booked</label><input id="car_booked"></td>
  <td><label>Car Allotted</label><input id="car_allotted"></td>
</tr>
<tr>
  <td><label>Chauffeur Name</label><input id="chauffeur_name"></td>
  <td><label>Mobile No</label><input id="mobile_no"></td>
  <td><label>Car No</label><input id="car_no"></td>
</tr>
</table>

  <!-- ROUTE -->
<table>
 <!-- ROUTING DETAILS (WIDE & TALL) -->
  <td colspan="2" style="vertical-align: top;">
    <b>Routing Details</b><br>
    <textarea id="routing_details" class="routing-box"></textarea>
  </td>
<td><label>Parking & Toll Interest Taxes</label><input id="parking" type="number"></td>
</tr>
</table>
<!-- SIGNATURES -->
<table>
<tr>
  <td width="50%">
    <label>Guest Signature </label>
    <canvas id="guestSign"></canvas>
    <div class="clear" onclick="clearCanvas('guestSign')">Clear Signature</div>
  </td>

  <td width="50%">
    <label>Chauffeur Signature </label>
   <canvas id="driverSign"></canvas>
    <div class="clear" onclick="clearCanvas('driverSign')">Clear Signature</div>
  </td>
</tr>
</table>

<p style="font-size:11px;margin-top:5px">
I confirm that I am responsible for full payment of this bill if not paid by the organisation.
</p>

<button onclick="window.print()">Print Trip Sheet</button>
</div>

<script>
const SCRIPT_URL = https://script.google.com/macros/s/AKfycbzDXW7mpvqaVAnUI4UA-u3fwVe8TOMw3SPOSc29-QUdSjqEtx9ylhuVmNYMTykhkMbn/exec;

// Load data
window.onload = () => {
  const dsNo = new URLSearchParams(location.search).get("ds_no");
  if (!dsNo) return;

  fetch(`${SCRIPT_URL}?ds_no=${dsNo}`)
    .then(r => r.json())
    .then(data => {
      Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = data[id];
      });
      calculateAll();
    });
};

// CALCULATIONS
["starting_date","starting_time","closing_date","closing_time","starting_km","closing_km"]
.forEach(id => document.getElementById(id).addEventListener("input", calculateAll));

function calculateAll() {

  /* ===== TOTAL KM ===== */
  const skm = parseFloat(document.getElementById("starting_km").value) || 0;
  const ckm = parseFloat(document.getElementById("closing_km").value) || 0;

  if (ckm >= skm) {
    document.getElementById("total_km").value = ckm - skm;
  }
  function calculateTotalHrsTimeOnly() {

  const st = document.getElementById("starting_time").value;
  const ct = document.getElementById("closing_time").value;

  if (!st || !ct) return;

  const [sh, sm] = st.split(":").map(Number);
  const [ch, cm] = ct.split(":").map(Number);

  let startMinutes = sh * 60 + sm;
  let endMinutes = ch * 60 + cm;

  // If crosses midnight
  if (endMinutes < startMinutes) {
    endMinutes += 24 * 60;
  }

  const diffMinutes = endMinutes - startMinutes;
  const totalHrs = diffMinutes / 60;

  document.getElementById("total_hrs").value = totalHrs.toFixed(2);
}

// Auto trigger
["starting_time", "closing_time"].forEach(id => {
  document.getElementById(id).addEventListener("change", calculateTotalHrsTimeOnly);
  document.getElementById(id).addEventListener("input", calculateTotalHrsTimeOnly);
});
</script>

</body>
</html>
