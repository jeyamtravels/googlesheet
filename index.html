<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Trip Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  padding:5px;
}

.sheet{
  max-width:900px;
  margin:auto;
  background:#fff;
  border:2px solid #000;
  padding:6px;
}

h2{
  text-align:center;
  letter-spacing:1px;
  margin:2px 0 6px;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

td{
  border:1px solid #000;
  padding:3px;
  vertical-align:top;
}

label{
  font-weight:bold;
  font-size:11px;
  display:block;
  margin-bottom:1px;
}

input, textarea{
  width:100%;
  border:none;
  outline:none;
  font-size:12px;
  padding:1px 0;
}

textarea{
  resize:none;
  line-height:1.2;
}


/* fixed widths */
.w-small{width:120px;}
.w-medium{width:160px;}
.w-large{width:260px;}

/* signature */
canvas{
  border:1px solid #000;
  width:100%;
  height:55px;   /* was 80px */
  touch-action:none;
}


.clear{
  font-size:11px;
  color:blue;
  cursor:pointer;
  margin-top:3px;
}

/* print */
@media print{
    @page{
        margin:6mm;
    }
    body{margin:0};
  body{background:#fff;}
  button{display:none;}
  h2{font-size:14px;margin:2px 0;}
  td{padding:2px;}
  canvas{height:45px;}
}

</style>
</head>
<body>

<div class="sheet">
<h2>TRIP SHEET</h2>

<table>
<tr>
<td class="w-medium"><label>Service City</label><input id="service_city"></td>
<td class="w-large"><label>Organisation</label><input id="organisation"></td>
<td><label>Guest Name</label><input id="guest_name"></td>
</tr>

<tr>
<td>DS No<br><input id="ds_no"></td>
<td>Booking ID<br><input id="booking_id"></td>
<td>Reporting Address<br><input id="reporting_address"></td>
</tr>

<tr>
<td class="w-small"><label>DS No</label><input id="starting_date"></td>
<td class="w-small"><label>Booking ID</label><input id="starting_time"></td>
<td><label>Reporting Address</label><input id="starting_km"></td>
</tr>

<tr>
<td>Closing Date<br><input id="closing_date"></td>
<td>Closing Time<br><input id="closing_time"></td>
<td>Closing KM<br><input id="closing_km"></td>
</tr>

<tr>
<td>Reporting Time<br><input id="reporting_time"></td>
<td>Car Booked<br><input id="car_booked"></td>
<td>Car Allotted<br><input id="car_allotted"></td>
</tr>

<tr>
<td>Chauffeur Name<br><input id="chauffeur_name"></td>
<td>Mobile No<br><input id="mobile_no"></td>
<td>Car No<br><input id="car_no"></td>
</tr>

<tr>
<td>Total Days<br><input id="total_days"></td>
<td>Total Hrs<br><input id="total_hrs"></td>
<td>Total KM<br><input id="total_km"></td>
</tr>

<tr>
<td colspan="2">Routing Details<br><textarea id="routing_details"></textarea></td>
<td>Parking & Toll<br><input id="parking_toll"></td>
</tr>

<tr>
<td>Guest Signature</td>
<td colspan="2">Chauffeur Signature</td>
</tr>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const tripId = params.get("trip_id");

const API_URL = "https://script.google.com/macros/s/AKfycbz5nZg83bT8UavKfw3DMwu6XAKOV-LR8rG3sx8KgttDzdKwN9O4SguWKeBuFKyi2mrA/exec" + "?trip_id=" + tripId;

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    for (const key in data) {
      if (document.getElementById(key)) {
        document.getElementById(key).value = data[key];
      }
    }
  });
</script>

</body>
</html>
